<style>
/* шрифт: Arial (обычной ширины), если он есть на устройстве; иначе его копия Liberation Sans с сайта (те же размеры и форма букв), чтобы везде было одинаково */
@font-face{font-family:"KN";src:local("Arial"),local("ArialMT"),url(/fonts/sans-Regular.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"KN";src:local("Arial Bold"),local("Arial-BoldMT"),url(/fonts/sans-Bold.woff2) format("woff2");font-weight:700;font-display:block}

/* те же цвета и шрифты, что на главной */
:root{--void:#060606;--sheet:#101010;--paper:#eeebe5;--ash:#85827c;--hair:rgba(238,235,229,.16);--bar:rgba(6,6,6,.82);--logo:none;color-scheme:dark;
  --f:"KN",Arial,"Liberation Sans","Helvetica Neue",Helvetica,sans-serif;
  --f-jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
:root[data-theme="light"]{--void:#e9e7e2;--sheet:#f6f5f1;--paper:#111;--ash:#6f6c66;--hair:rgba(17,17,17,.16);--bar:rgba(233,231,226,.85);--logo:invert(1);color-scheme:light}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-transform:inherit}
:focus-visible{outline:1px solid var(--paper);outline-offset:3px}
::selection{background:var(--paper);color:var(--void)}
.wrap{padding-left:var(--gl);padding-right:var(--gr);max-width:1480px;margin-inline:auto}
.lb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.2}
.m{color:var(--ash)}
[hidden]{display:none!important}
html:not([lang="uk"]) [data-uk],html[lang="uk"] [data-en]{display:none!important}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:12px}
.top nav{display:flex;gap:clamp(14px,3vw,32px);align-items:center}
.top nav a{opacity:.7;transition:opacity .2s}
.top nav a:hover{opacity:1}
.top .logo{height:26px;width:auto;filter:var(--logo)}
.tgl{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 8px;border:1px solid var(--hair);border-radius:999px;transition:border-color .3s}
.tgl:hover{border-color:var(--paper)}
.tgl svg{width:12px;height:12px}

main{padding-block:clamp(28px,5vw,64px) clamp(48px,7vw,96px)}
h1{font-weight:400;font-size:clamp(56px,10vw,150px);line-height:.85;letter-spacing:-.04em;margin:12px 0 18px}
.intro{display:flex;justify-content:space-between;gap:16px 24px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid var(--hair);padding-bottom:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--hair);border-radius:999px;padding:6px 12px;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--paper)}
.chip.on{background:var(--paper);color:var(--void);border-color:var(--paper)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:999px;border:1px solid var(--hair);font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.frame img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05) brightness(.85);transition:filter 1.6s,transform 1.6s}
.frame.blank{display:grid;place-items:center}
.frame.blank img{width:46%;height:auto;object-fit:contain;filter:var(--logo);opacity:.35}
.r{display:grid;grid-template-columns:168px minmax(0,1fr) auto 120px;gap:clamp(12px,2vw,28px);align-items:center;padding:16px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left;cursor:pointer}
.r:hover .frame img{filter:grayscale(0) contrast(1.02) brightness(.95);transform:scale(1.04)}
.r:hover .frame.blank img{filter:var(--logo);transform:none}
.r .t{font-size:clamp(22px,2.2vw,32px);line-height:1;letter-spacing:-.02em}
.r .tags{margin-top:8px}
.r .price{font-size:clamp(22px,2.2vw,32px);text-align:right;white-space:nowrap;letter-spacing:-.02em}
.old{text-decoration:line-through;color:var(--ash);margin-right:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border:1px solid var(--paper);border-radius:999px;white-space:nowrap;transition:background .3s,color .3s}
.btn:hover{background:var(--paper);color:var(--void)}
.btn.solid{background:var(--paper);color:var(--void)}
.btn.solid:hover{background:none;color:var(--paper)}
.r .btn{justify-self:end;min-width:96px}
.soon{padding:clamp(40px,7vw,96px) 0;display:grid;gap:14px}
.soon p{margin:0;font-size:clamp(28px,4vw,56px);line-height:1;letter-spacing:-.02em;max-width:18ch}
.empty{padding:40px 0;color:var(--ash)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--hair);border-radius:999px;transition:border-color .2s;width:220px}
.search:focus-within{border-color:var(--paper)}
.search svg{flex:none;color:var(--ash)}
.search input{flex:1;min-width:0;font:inherit;color:var(--paper);background:none;border:0;outline:none;text-transform:none;font-weight:400;font-size:14px;-webkit-appearance:none}
.search input::placeholder{color:var(--ash)}
.views{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:2px}
.vw{height:26px;padding:0 12px;border-radius:999px;color:var(--ash);transition:background .25s,color .25s}
.vw.on{background:var(--paper);color:var(--void)}
.yh{font-size:clamp(34px,4.5vw,64px);letter-spacing:-.04em;line-height:.85;padding:clamp(28px,3vw,44px) 0 12px;border-bottom:1px solid var(--hair)}
.i-t{font-size:clamp(30px,4vw,60px);line-height:.92;letter-spacing:-.03em;margin:8px 0 10px}
.i-f{display:flex;align-items:center;gap:18px;margin-top:16px}
.i-p{font-size:clamp(24px,2.4vw,36px);letter-spacing:-.02em}
.flow{padding-top:24px;user-select:none;-webkit-user-select:none}
.stage{position:relative;height:clamp(200px,24vw,330px);perspective:1100px;transform-style:preserve-3d;overflow:hidden;touch-action:pan-y;cursor:grab}
.stage:active{cursor:grabbing}
.fc{position:absolute;left:50%;top:50%;width:clamp(240px,30vw,440px);margin-left:calc(clamp(240px,30vw,440px) / -2);translate:0 -50%;transition:transform .7s cubic-bezier(.2,.75,.2,1),opacity .5s;-webkit-box-reflect:below 6px linear-gradient(transparent 70%,rgba(0,0,0,.25))}
.fc .frame{box-shadow:0 30px 60px rgba(0,0,0,.5)}
.fc .frame img{pointer-events:none;-webkit-user-drag:none}
.f-info{text-align:center;max-width:760px;margin:clamp(24px,3vw,40px) auto 0;cursor:pointer;display:grid;justify-items:center}
.f-info .tags{justify-content:center}
.f-nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:22px}
#fPos{min-width:60px;text-align:center}

/* окно покупки */
dialog{border:1px solid var(--hair);background:var(--sheet);color:var(--paper);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;font:inherit}
dialog[open]{animation:dlg-in .4s cubic-bezier(.2,0,0,1)}
dialog.closing{animation:dlg-out .25s cubic-bezier(.4,0,1,1) forwards}
dialog.closing::backdrop{animation:bd-out .25s ease forwards}
@keyframes dlg-out{to{opacity:0;transform:scale(.97);filter:blur(6px)}}
@keyframes bd-out{to{opacity:0}}
dialog[open]::backdrop{animation:bd-in .4s ease}
@keyframes dlg-in{from{opacity:0;transform:scale(.97);filter:blur(8px)}}
@keyframes bd-in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){dialog[open],dialog[open]::backdrop,dialog.closing,dialog.closing::backdrop{animation:none}}
.hint{color:var(--ash)}
.two{align-items:start}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

.b-in{padding:clamp(20px,3vw,32px);display:grid;gap:18px}
.b-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.b-in .frame img{filter:grayscale(1) contrast(1.05)}
.b-in h2{font-weight:400;font-size:clamp(30px,4vw,44px);line-height:.95;letter-spacing:-.02em;margin:8px 0 0}
#bTags{margin-top:10px}
.b-price{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--paper);padding-top:14px}
.b-price .v{font-size:clamp(34px,4vw,52px);line-height:1;letter-spacing:-.03em;text-transform:none}
.field{display:grid;gap:8px}
.field > span{display:flex;justify-content:space-between;gap:12px}
.amt{display:flex;align-items:center;border:1px solid var(--hair);background:var(--void);transition:border-color .2s}
.amt:focus-within{border-color:var(--paper)}
.amt b{padding-left:12px;font-weight:400;font-size:18px}
.amt input{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--paper);background:none;border:0;padding:10px 12px 10px 6px;outline:none}
#pp{min-height:48px;color-scheme:light;background:none}
#pp iframe{color-scheme:light;background:transparent}
/* PayPal рисует свой блок для светлого фона (тёмный текст в форме карты, ошибки, «18 years»).
   В тёмной теме блок инвертируется: фон и кнопки становятся чёрными, текст светлым, синий цвет сохраняется. */
:root:not([data-theme="light"]) #pp iframe{filter:invert(1) hue-rotate(180deg)}
.b-msg{color:var(--ash)}
.b-code{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:20px}
.b-code .lnk{color:var(--ash);text-decoration:underline;text-underline-offset:3px}
.b-code .amt{flex:1;min-width:150px}.b-code .amt input{font-size:15px;padding:7px 12px;text-transform:uppercase}
.b-code .ok{color:var(--paper)}
.b-files{display:grid;gap:8px}.b-files a{justify-content:space-between}
.b-msg.err{color:var(--paper)}
.b-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:760px){
  .r{grid-template-columns:110px minmax(0,1fr) auto;row-gap:10px}
  .tools{width:100%}.search{flex:1;width:auto}
  .stage{height:190px}.fc{width:230px;margin-left:-115px}.i-t{font-size:30px}
  .r .t,.r .price{font-size:20px}
  .r .btn{grid-column:2/-1;justify-self:start;height:30px}
  .top .who .m{display:none}
}

/* превью эдита в окне покупки: обложка с кнопкой, по нажатию видео с YouTube прямо там */
.b-in .frame.pv{cursor:pointer}
.pv-play{position:absolute;white-space:nowrap;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid #eeebe5;border-radius:999px;background:rgba(0,0,0,.45);color:#eeebe5;transition:background .3s,color .3s}
.frame.pv:hover .pv-play,.pv-play:focus-visible{background:#eeebe5;color:#000}
.pv-play svg{width:12px;height:12px}
/* свой плеер превью: YouTube рендерится вдвое больше и сжимается, его кнопки не видны и не нажимаются */
.mp{position:absolute;inset:0;background:#000;overflow:hidden}
.mp .yt{position:absolute;left:0;top:-50%;width:200%;height:400%;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.mp .yt iframe{width:100%;height:100%;border:0;display:block}
.mp-shield{position:absolute;inset:0;z-index:1;cursor:pointer}
.mp-cov{position:absolute;inset:0;z-index:2;filter:grayscale(1);display:grid;place-items:center;background:#000 center/cover;transition:opacity .4s}
.mp-cov::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.mp-cov>*{position:relative}
.mp.on .mp-cov{opacity:0;pointer-events:none}
.mp:not(.end) .mp-cov{pointer-events:none}
.mp-load{width:22px;height:22px;border:1px solid rgba(238,235,229,.3);border-top-color:#eeebe5;border-radius:50%;animation:mpSpin .9s linear infinite}
.mp.end .mp-load,.mp.on .mp-load,.mp.ps .mp-load{display:none}
.mp-ic{display:none;width:58px;height:58px;border:1px solid #eeebe5;border-radius:50%;place-items:center;color:#eeebe5}
.mp-ic svg{width:16px;height:16px;margin-left:3px}
.mp.ps .mp-ic{display:grid}
@keyframes mpSpin{to{transform:rotate(360deg)}}
.mp-cov .pv-play{position:static;transform:none}
.mp-bar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;padding:22px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#eeebe5;opacity:1;transition:opacity .3s}
.mp.on:not(:hover) .mp-bar{opacity:0}
@media (hover:none){.mp.on .mp-bar{opacity:1}}
.mp-b{width:28px;height:28px;display:grid;place-items:center;color:#eeebe5;background:none;border:0;padding:0;flex:none}
.mp-b svg{width:14px;height:14px}
.mp-t{font-size:11px;font-variant-numeric:tabular-nums;opacity:.8;flex:none}
.mp-seek{position:relative;flex:1;height:20px;cursor:pointer;touch-action:none}
.mp-seek::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:rgba(238,235,229,.3)}
.mp-seek i{position:absolute;left:0;top:9px;height:1px;width:0;background:#eeebe5}
.mp-seek i::after{content:"";position:absolute;right:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:#eeebe5}
/* плавный переход между страницами: размытие + лёгкий зум (Chrome, Edge, Safari 18.2+; в остальных просто открывается) */
@view-transition{navigation:auto;types:page}
:root:active-view-transition-type(page)::view-transition-old(root){animation:pg-out .35s cubic-bezier(.4,0,.2,1) both}
:root:active-view-transition-type(page)::view-transition-new(root){animation:pg-in .55s cubic-bezier(.4,0,.2,1) .22s both}
:root:active-view-transition-type(page) .top .logo{view-transition-name:logo}
/* на компьютере без размытия: блюр на весь большой экран тормозит, остаются затухание и зум */
@keyframes pg-out{to{opacity:0}}
@keyframes pg-in{from{opacity:0}}
@keyframes bl-out{to{opacity:0}}
@keyframes bl-in{from{opacity:0}}
@media (max-width:760px){
  @keyframes pg-out{to{opacity:0;filter:blur(12px);transform:scale(.985)}}
  @keyframes pg-in{from{opacity:0;filter:blur(12px);transform:scale(1.015)}}
  @keyframes bl-out{to{opacity:0;filter:blur(8px)}}
  @keyframes bl-in{from{opacity:0;filter:blur(8px)}}
}
::view-transition-old(root),::view-transition-new(root),::view-transition-group(logo){will-change:opacity,transform}
.vt-blur::view-transition-old(root){animation:bl-out .25s ease both}
.vt-blur::view-transition-new(root){animation:bl-in .4s ease both}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}
.vt-theme::view-transition-old(root),.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}
</style>
<script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/"},"eagerness":"moderate"}]}</script>
</head>
<body>
<header class="top">
  <div class="wrap lb">
    <a href="/" class="who" style="display:flex;gap:10px;align-items:center"><img class="logo" src="/img/logo.png" alt="Katsuyuki"><span class="m"><span data-en>Video editor</span><span data-uk>Відеомонтажер</span></span></a>
    <nav><a href="/"><span data-en>← Back</span><span data-uk>← Назад</span></a><button class="tgl" id="langBtn" type="button" aria-label="Language"></button><button class="tgl" id="themeBtn" type="button" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor"/></svg></button></nav>
  </div>
</header>

<main class="wrap">
  <div class="lb m"><span data-en>Project files / Packs</span><span data-uk>Проєктні файли / Паки</span></div>
  <h1>PFS</h1>
  <div class="intro">
    <div class="chips lb" id="chips">
      <button class="chip on" type="button" data-f="all"><span data-en>All</span><span data-uk>Усі</span></button>
      <button class="chip" type="button" data-f="paid"><span data-en>Paid</span><span data-uk>Платні</span></button>
      <button class="chip" type="button" data-f="free"><span data-en>Free</span><span data-uk>Безкоштовні</span></button>
      <button class="chip" type="button" data-f="pack"><span data-en>Packs</span><span data-uk>Паки</span></button>
    </div>
    <div class="tools lb" id="tools">
      <label class="search"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" autocomplete="off" aria-label="Search"></label>
      <span class="views"><button class="vw" type="button" data-v="flow"><span data-en>Carousel</span><span data-uk>Карусель</span></button><button class="vw" type="button" data-v="list"><span data-en>List</span><span data-uk>Список</span></button></span>
    </div>
  </div>
  <div id="list"></div>
</main>

<dialog id="buyBox" aria-labelledby="bTitle">
  <div class="b-in" id="bIn">
    <div class="b-head"><div class="lb m" id="bKind"></div><button class="tgl lb" type="button" id="bClose" aria-label="Close">✕</button></div>
    <div class="frame" id="bCover"></div>
    <div><h2 id="bTitle"></h2><div class="tags" id="bTags"></div></div>
    <div class="b-price lb"><span><span data-en>Price</span><span data-uk>Ціна</span></span><span class="v" id="bPrice"></span></div>
    <label class="field lb" id="bAmt" hidden><span><span><span data-en>Your price</span><span data-uk>Ваша ціна</span></span><span class="m" id="bMin"></span></span>
      <span class="amt"><b>€</b><input type="number" inputmode="decimal" id="bAmount" min="0" step="0.5"></span></label>
    <label class="field lb"><span><span data-en>Your email</span><span data-uk>Ваша пошта</span></span>
      <span class="amt"><input type="email" id="bEmail" autocomplete="email" inputmode="email" placeholder="name@mail.com" maxlength="120"></span></label>
    <div class="b-code" id="bCodeBox"><button class="lnk lb" type="button" id="bCodeOpen"><span data-en>Have a code?</span><span data-uk>Є промокод?</span></button>
      <span class="amt" id="bCodeRow" hidden><input type="text" id="bCode" maxlength="40" autocomplete="off" spellcheck="false" aria-label="Promo code"></span>
      <button class="btn lb" type="button" id="bCodeApply" hidden><span data-en>Apply</span><span data-uk>Застосувати</span></button>

  function open(p){
    cur = p; track("files: open " + p.title);
    $("bIn").hidden = false; $("bDone").hidden = true;
    $("bKind").innerHTML = p.bundle ? both("Bundle · " + p.bundle.length + " files", "Набір · " + p.bundle.length + " файлів") : isPack(p) ? both("Pack", "Пак") : both("Project file", "Проєктний файл");
    disc = null; $("bCode").value = ""; $("bCodeMsg").textContent = ""; $("bCodeRow").hidden = $("bCodeApply").hidden = true; $("bCodeOpen").hidden = false;
    $("bCodeBox").hidden = !p.price || !ENDPOINT || !(CODES_LIVE || DEMO || /[?&]test\b/.test(location.search));
    $("bCover").outerHTML = cover(p, "bCover"); preview(p);
    $("bTitle").textContent = p.title; $("bTags").innerHTML = tags(p);
    $("bPrice").innerHTML = priceText(p);
    try{ $("bEmail").value = $("bEmail").value || localStorage.getItem("mail") || ""; }catch(e){ }
    $("bAmt").hidden = !p.pwyw; $("bAmount").min = p.price; $("bAmount").value = p.price || "";
    $("bAmount").placeholder = p.price ? String(p.price) : "0";
    $("bMin").innerHTML = p.price ? both("min ", "мін. ") + eur(p.price) : both("0 = free", "0 = безкоштовно");
    mode(); paypal();
    if(box.showModal) box.showModal(); else box.setAttribute("open", "");
    try{ history.replaceState(null, "", "?" + (/[?&]test\b/.test(location.search) ? "test&" : "") + "f=" + p.id); }catch(e){}
  }
  function shut(){ stopPreview(); box.classList.remove("closing"); if(box.close) box.close(); else box.removeAttribute("open"); try{ history.replaceState(null, "", location.pathname + (/[?&]test\b/.test(location.search) ? "?test" : "")); }catch(e){} }
  function close(){
    if(!box.open || box.classList.contains("closing")) return;
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ shut(); return; }
    box.classList.add("closing");
    var t = setTimeout(shut, 400);
    box.addEventListener("animationend", function h(e){ if(e.target !== box) return; box.removeEventListener("animationend", h); clearTimeout(t); shut(); });
  }
  box.addEventListener("cancel", function(e){ e.preventDefault(); close(); });
  box.addEventListener("click", function(e){ if(e.target === box) close(); });
  $("bClose").addEventListener("click", close); $("bClose2").addEventListener("click", close);
  $("bAmount").addEventListener("input", mode);
  $("bEmail").addEventListener("input", function(){ if(goodMail()) mode(); });

  function call(o){
    return fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(o) })
      .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok || !j.url) throw new Error(j.error || "no link"); return j; });
  }
  function done(url, j){
    try{ localStorage.setItem("mail", email()); }catch(e){ }
    $("bLink").href = url; $("bIn").hidden = true; $("bDone").hidden = false;
    var many = j && j.files && j.files.length > 1;
    $("bLink").parentNode.hidden = many; $("bFiles").hidden = !many; $("bFiles").innerHTML = "";
    if(many) j.files.forEach(function(f){ var a = document.createElement("a"); a.className = "btn lb"; a.href = f.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = f.title + " ↓"; $("bFiles").appendChild(a); });
    var lim = j && j.hours ? (uk() ? "Посилання працює " + j.hours + " год. і відкривається " + j.uses + " рази. " : "The link works for " + j.hours + " hours and opens " + j.uses + " times. ") : "";
    $("bDoneTxt").textContent = lim + (uk() ? "Копію також надіслано на " : "A copy was also sent to ") + email() + ".";
  }
  $("bFree").addEventListener("click", function(){
    if(!ENDPOINT){ msg(uk() ? "Завантаження ще налаштовується." : "Downloads are being set up.", true); return; }
    if(!goodMail()){ needMail(); return; }
    var b = this; b.disabled = true; msg(uk() ? "Готую файл…" : "Preparing the file…");
    call({ action: "free", id: cur.id, email: email(), code: disc ? disc.code : "", lang: uk() ? "UA" : "EN" }).then(function(j){ track("files: download " + cur.title); done(j.url, j); })
      .catch(function(err){ msg(String(err && err.message) === "limit" ? (uk() ? "Забагато завантажень. Спробуйте пізніше." : "Too many downloads. Please try again later.") : (uk() ? "Не вдалося. Спробуйте ще раз." : "Something went wrong. Please try again."), true); })
      .then(function(){ b.disabled = false; });
  });

  /* промокод */
  $("bCodeOpen").addEventListener("click", function(){ this.hidden = true; $("bCodeRow").hidden = $("bCodeApply").hidden = false; $("bCode").focus(); });
  function applyCode(){
    var c = String($("bCode").value).trim(), m = $("bCodeMsg"), b = $("bCodeApply");
    if(!c) return;
    b.disabled = true; m.classList.remove("ok"); m.textContent = uk() ? "Перевіряю…" : "Checking…";
    (DEMO ? new Promise(function(ok){ setTimeout(function(){ ok({ json: function(){ return { ok: true, code: c.toUpperCase(), pct: 20, price: Math.round(cur.price * 80) / 100 }; } }); }, 300); }) : fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "code", id: cur.id, code: c }) }))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j.ok){ disc = null; m.textContent = uk() ? "Код не діє" : "This code doesn't work"; }
        else { disc = { code: j.code, pct: j.pct, price: j.price }; m.classList.add("ok"); m.textContent = "✓ −" + j.pct + "%"; track("files: code " + j.code); }
        showPrice(); mode();
      })
      .catch(function(){ m.textContent = uk() ? "Не вдалося перевірити" : "Couldn't check the code"; })
      .then(function(){ b.disabled = false; });
  }
  $("bCodeApply").addEventListener("click", applyCode);
  $("bCode").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); applyCode(); } });

  /* PayPal: кнопка появляется только когда вставлен PAYPAL_CLIENT_ID */
  var sdk = null;
  function loadSdk(){
    if(sdk) return sdk;
    sdk = new Promise(function(ok, bad){
      var s = document.createElement("script");
      s.src = "https://www.paypal.com/sdk/js?client-id=" + encodeURIComponent(PAYPAL_CLIENT_ID) + "&currency=EUR&intent=capture&components=buttons";
      s.onload = ok; s.onerror = function(){ sdk = null; bad(); }; document.head.appendChild(s);
    });
    return sdk;
  }
  function paypal(){
    var el = $("pp"); el.innerHTML = "";
    if(!PAYPAL_CLIENT_ID || (!cur.price && !cur.pwyw)) return;
    var p = cur;
    loadSdk().then(function(){
      if(cur !== p) return;
      window.paypal.Buttons({
        style: { layout: "vertical", shape: "pill", color: root.getAttribute("data-theme") === "light" ? "black" : "white", label: "pay", height: 44 },
        onClick: function(d, actions){
          var a = p.pwyw ? amount() : need();
          if(a < need() || a <= 0){ mode(); return actions.reject(); }
          if(!goodMail()){ needMail(); return actions.reject(); }
          return actions.resolve();
        },
        createOrder: function(d, actions){
          var a = p.pwyw ? amount() : need();
          return actions.order.create({
            purchase_units: [{ amount: { currency_code: "EUR", value: a.toFixed(2) }, description: p.title.slice(0, 120), custom_id: p.id + (disc ? "|" + disc.code : "") }],
            application_context: { shipping_preference: "NO_SHIPPING", brand_name: "Katsuyuki" }
          });
        },
        onApprove: function(d, actions){
          msg(uk() ? "Перевіряю оплату…" : "Checking the payment…");
          return actions.order.capture().then(function(o){
            track("files: paid " + p.title);
            return call({ action: "sale", id: p.id, orderID: o.id, email: email(), lang: uk() ? "UA" : "EN" });
          }).then(function(j){ done(j.url, j); })
            .catch(function(){ msg(uk() ? "Оплата пройшла, але файл не відкрився. Напишіть мені, я надішлю його вручну." : "Paid, but the file didn't open. Write to me and I'll send it by hand.", true); });
        },
        onError: function(){ msg(uk() ? "PayPal не відповів. Спробуйте ще раз." : "PayPal didn't respond. Please try again.", true); }
      }).render(el);
    }).catch(function(){ msg(uk() ? "PayPal не завантажився." : "PayPal didn't load.", true); });
  }

  if(MAINTENANCE){
    document.getElementById("chips").hidden = true; document.getElementById("tools").hidden = true;
    list.innerHTML = '<div class="soon"><div class="lb m">' + both("Under maintenance", "Технічні роботи") + '</div>' +
      '<p>' + both("The shop is being updated and will be back soon.", "Магазин оновлюється і скоро знову запрацює.") + '</p></div>';
    return;
  }
  draw();
  var want = new URLSearchParams(location.search).get("f");
  if(want){ var w = SHOP.find(function(x){ return x.id === want; }); if(w){ var k = flowItems.indexOf(w); if(k > -1) go(k); open(w); } }
})();
</script>

  gc.setAttribute("data-goatcounter", "https://katsuyuki.goatcounter.com/count"); document.head.appendChild(gc);
